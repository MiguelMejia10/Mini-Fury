stages: [verify]
backend:
  stage: verify
  image: golang:1.25
  timeout: 15m
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: mini_fury
    POSTGRES_DB: mini_fury_ci
    POSTGRES_PASSWORD: ci_disposable_only
    TEST_DATABASE_URL: postgres://mini_fury:ci_disposable_only@postgres:5432/mini_fury_ci?sslmode=disable
  script:
    - sh scripts/ci-backend.sh
frontend:
  stage: verify
  image: node:22
  timeout: 10m
  script:
    - sh scripts/ci-frontend.sh
backup-tool:
  stage: verify
  image: python:3.12-slim
  script:
    - python3 -m unittest discover -s scripts -p 'test_*.py'
