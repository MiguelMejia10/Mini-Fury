name: mini-operador-ti
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mini_fury
      POSTGRES_DB: mini_fury
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_fury -d mini_fury"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  platform-api:
    build: ./platform-api
    env_file:
      - path: .local/runtime.env
        required: false
    environment:
      DATABASE_URL: postgres://mini_fury:${POSTGRES_PASSWORD}@postgres:5432/mini_fury?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  user-bootstrap:
    profiles: [setup]
    build: ./platform-api
    entrypoint: ["platform-user"]
    environment:
      DATABASE_URL: postgres://mini_fury:${POSTGRES_PASSWORD}@postgres:5432/mini_fury?sslmode=disable
    env_file:
      - path: .local/bootstrap.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
  postgres-test:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mini_fury
      POSTGRES_DB: mini_fury_test
      POSTGRES_PASSWORD: disposable_test_only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_fury -d mini_fury_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    profiles: [test]
    build:
      context: ./platform-api
      target: build
    environment:
      TEST_DATABASE_URL: postgres://mini_fury:disposable_test_only@postgres-test:5432/mini_fury_test?sslmode=disable
    command: ["go", "test", "-count=1", "-v", "./..."]
    depends_on:
      postgres-test:
        condition: service_healthy
  postgres-perf:
    profiles: [perf]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mini_fury
      POSTGRES_DB: mini_fury_perf
      POSTGRES_PASSWORD: disposable_perf_only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_fury -d mini_fury_perf"]
      interval: 2s
      timeout: 3s
      retries: 30
  perf-bootstrap:
    profiles: [perf]
    build: ./platform-api
    entrypoint: ["platform-user"]
    environment:
      DATABASE_URL: postgres://mini_fury:disposable_perf_only@postgres-perf:5432/mini_fury_perf?sslmode=disable
      ADMIN_EMAIL: load@mini-fury.local
      ADMIN_NAME: Load test fixture
      ADMIN_PASSWORD: Disposable-Load-Only-2026!
    depends_on:
      postgres-perf:
        condition: service_healthy
  perf-api:
    profiles: [perf]
    build: ./platform-api
    environment:
      DATABASE_URL: postgres://mini_fury:disposable_perf_only@postgres-perf:5432/mini_fury_perf?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      ALLOWED_ORIGINS: http://perf.local
      COOKIE_SECURE: 'false'
      INSTANCE_ID: perf
    depends_on:
      postgres-perf:
        condition: service_healthy
  load:
    profiles: [perf]
    image: grafana/k6:1.3.0
    volumes:
      - ./perf:/scripts:ro
      - ./.local/perf:/results
    user: "0:0"
    command: ["run", "/scripts/catalog.js"]
    depends_on:
      perf-api:
        condition: service_started

volumes:
  postgres_data:
