# Standalone production deployment; never merges main development ports or credentials.
name: mini-fury-production
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mini_fury
      POSTGRES_USER: mini_fury
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define a production database password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U mini_fury -d mini_fury']
      interval: 3s
      retries: 30
    restart: unless-stopped
  platform-api:
    build: ./platform-api
    env_file: ['${RUNTIME_ENV_FILE:-.local/production-runtime.env}']
    environment:
      DATABASE_URL: postgres://mini_fury:${POSTGRES_PASSWORD}@postgres:5432/mini_fury?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      COOKIE_SECURE: 'true'
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Define your HTTPS origin}
      APP_PUBLIC_URL: ${PUBLIC_ORIGIN}
      TRUSTED_PROXY_CIDRS: 172.30.50.10/32
      OPERATION_LOG_DIR: /var/log/mini-fury
    networks: [private,edge]
    volumes: [operation_logs:/var/log/mini-fury]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/production/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Define the public hostname}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
    ports:
      - '${BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:80'
      - '${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443'
    networks:
      edge:
        ipv4_address: 172.30.50.10
    volumes: [caddy_data:/data,caddy_config:/config]
    depends_on: [platform-api]
    restart: unless-stopped
networks:
  private:
    internal: true
  edge:
    ipam:
      config: [{subnet: 172.30.50.0/24}]
volumes:
  postgres_data:
  operation_logs:
  caddy_data:
  caddy_config:
